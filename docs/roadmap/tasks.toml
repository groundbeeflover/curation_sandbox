[[milestones]]
id = "M1"
title = "M1 Walking skeleton"
due_on = "2026-11-27"
description = "The app opens, a room is built, one painting hangs at its true size under one spotlight in candela, you walk around it and read its lux; every layer exists thinly and is tested. Exit criteria: docs/roadmap.md#m1-walking-skeleton"

[[milestones]]
id = "M2"
title = "M2 Build and hang"
due_on = "2026-12-18"
description = "Journey J1 without the catalogue: walls and openings, six frame styles, imports and checklists, hanging with snapping, save, undo and recovery, a 50-work gallery within memory budget. Exit criteria: docs/roadmap.md#m2-build-and-hang"

[[milestones]]
id = "M3"
title = "M3 Light it right"
due_on = "2027-02-12"
description = "Journey J2: real fixtures from IES files, painting materials and glazing, bounced light, conservation classes and exposure, path-traced stills. Exit criteria: docs/roadmap.md#m3-light-it-right"

[[milestones]]
id = "M4"
title = "M4 Curator alpha"
due_on = "2027-03-19"
description = "Journeys J1 to J4 on curators' own machines: the catalogue, installation documents, portable builds. Tagged v0.1.0. Exit criteria: docs/roadmap.md#m4-curator-alpha"

[[milestones]]
id = "M5"
title = "M5 Ray-traced tier"
due_on = "2027-04-30"
description = "The Ray-traced tier and the GPU path tracer on RTX and RDNA2+ GPUs. Exit criteria: docs/roadmap.md#m5-ray-traced-tier"

[[milestones]]
id = "M6"
title = "M6 Release 1.0"
due_on = "2027-06-25"
description = "Floor-plan underlay, plinths and benches, daylight, walkthroughs, a 300-work catalogue, labels, signed installers. Tagged v1.0.0. Exit criteria: docs/roadmap.md#m6-release-10"

