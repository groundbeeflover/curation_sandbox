# Throwaway workflow for spike M1-03 (issue #38). Lives only on the spike/lavapipe branch.
name: spike-lavapipe

on:
  push:
    branches: [spike/lavapipe]

permissions:
  contents: read

env:
  MESA_VERSION: "26.2.6"
  MESA_SHA256: b9436b3e1a8be76fbd4823dc884f90596ab7c6ac5e1867a305e66ffccfb31a92
  VULKAN_SDK_VERSION: "1.4.363.1"

jobs:
  # Option A: Mesa, validation layers and vulkaninfo from the Ubuntu 24.04 archive.
  linux-ubuntu-archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runner image and what is already installed
        run: |
          echo "ImageVersion=$ImageVersion"; nproc; free -g; lscpu | grep -E 'Model name' || true
          grep -o -w -E 'avx2|avx512f' /proc/cpuinfo | sort -u
          dpkg -l | grep -Ei 'mesa|vulkan|libllvm' | awk '{print $2, $3}' || echo "none"
          ls /usr/share/vulkan/icd.d 2>/dev/null || echo "no ICDs"
      - name: Install from the archive (timed)
        run: |
          start=$(date +%s.%N)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers vulkan-tools vulkan-validationlayers libvulkan-dev ninja-build >/dev/null
          echo "install seconds: $(echo "$(date +%s.%N) - $start" | bc)"
          dpkg -l | grep -E 'mesa-vulkan-drivers|libllvm|vulkan-validationlayers|libvulkan1|vulkan-tools' | awk '{print $2, $3}'
          apt-cache policy mesa-vulkan-drivers vulkan-validationlayers
          apt-cache madison mesa-vulkan-drivers
          ls /usr/share/vulkan/icd.d /usr/share/vulkan/explicit_layer.d
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json)" >> "$GITHUB_ENV"
      - name: vulkaninfo
        run: |
          echo "$VK_DRIVER_FILES"; cat "$VK_DRIVER_FILES"
          vulkaninfo --summary
          vulkaninfo > vulkaninfo.txt 2>&1 || true
          grep -E 'apiVersion|driverInfo|VK_KHR_ray_query|VK_KHR_acceleration_structure|VK_EXT_headless_surface|VK_KHR_ray_tracing_pipeline' vulkaninfo.txt | sort -u
      - name: Build the throwaway program
        run: cmake -S spike/lvpbench -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - name: Benchmark (timed)
        run: time spike/bench.sh build/lvpbench ubuntu-archive results.jsonl
      - name: What a PPA would give (not installed)
        run: |
          sudo add-apt-repository -y -n ppa:kisak/kisak-mesa >/dev/null 2>&1 && sudo apt-get update -qq
          apt-cache policy mesa-vulkan-drivers | head -8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-ubuntu-archive
          path: |
            results.jsonl
            vulkaninfo.txt
            images/

  # Option C: a pinned Mesa release built from source (lavapipe only), cached; validation layers,
  # loader and vulkaninfo from the pinned LunarG SDK tarball, cached.
  linux-pinned-mesa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Runner
        run: echo "ImageVersion=$ImageVersion"; nproc
      - name: Restore Mesa
        id: mesa-cache
        uses: actions/cache@v4
        with:
          path: ~/mesa
          key: mesa-lavapipe-${{ env.MESA_VERSION }}-llvm18-static-ubuntu-24.04-v2
      - name: Build dependencies of Mesa (timed)
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s.%N)
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3-mako python3-yaml python3-packaging ninja-build bison flex glslang-tools llvm-dev libpolly-18-dev libxml2-dev libedit-dev libffi-dev libncurses-dev libzstd-dev zlib1g-dev libexpat1-dev libdrm-dev libelf-dev >/dev/null
          pip install --break-system-packages -q meson==1.9.1
          echo "deps seconds: $(echo "$(date +%s.%N) - $start" | bc)"
          llvm-config --version
      - name: Build Mesa (timed)
        if: steps.mesa-cache.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s.%N)
          spike/build-mesa.sh "$MESA_VERSION" "$MESA_SHA256" "$HOME/mesa"
          echo "mesa build seconds: $(echo "$(date +%s.%N) - $start" | bc)"
      - name: Mesa runtime libraries
        run: |
          du -sh ~/mesa; find ~/mesa -type f | head -20
          cat ~/mesa/share/vulkan/icd.d/lvp_icd*.json
          ldd ~/mesa/lib/libvulkan_lvp.so | awk '{print $1, $3}'
      - name: Restore the Vulkan SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ~/vulkan-sdk
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}-linux-v1
      - name: Download the Vulkan SDK (timed)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s.%N)
          curl -sSfL --retry 3 -o sdk.tar.xz "https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          echo "download seconds: $(echo "$(date +%s.%N) - $start" | bc)"; ls -la sdk.tar.xz; sha256sum sdk.tar.xz
          mkdir -p ~/vulkan-sdk
          tar xf sdk.tar.xz -C ~/vulkan-sdk --strip-components=2 --wildcards \
            "${VULKAN_SDK_VERSION}/x86_64/lib/libVkLayer_khronos_validation.so" \
            "${VULKAN_SDK_VERSION}/x86_64/share/vulkan/explicit_layer.d/VkLayer_khronos_validation.json" \
            "${VULKAN_SDK_VERSION}/x86_64/bin/vulkaninfo" \
            "${VULKAN_SDK_VERSION}/x86_64/include/vulkan/*" "${VULKAN_SDK_VERSION}/x86_64/include/vk_video/*"
          echo "download and extract seconds: $(echo "$(date +%s.%N) - $start" | bc)"
          du -sh ~/vulkan-sdk; find ~/vulkan-sdk -maxdepth 3 | head -30
      - name: Environment
        run: |
          echo "VK_DRIVER_FILES=$(ls $HOME/mesa/share/vulkan/icd.d/lvp_icd*.json)" >> "$GITHUB_ENV"
          echo "VK_LAYER_PATH=$HOME/vulkan-sdk/share/vulkan/explicit_layer.d" >> "$GITHUB_ENV"
      - name: vulkaninfo
        run: |
          ~/vulkan-sdk/bin/vulkaninfo --summary
          ~/vulkan-sdk/bin/vulkaninfo > vulkaninfo.txt 2>&1 || true
          grep -E 'apiVersion|driverInfo|VK_KHR_ray_query|VK_KHR_acceleration_structure|VK_EXT_headless_surface|VK_KHR_ray_tracing_pipeline' vulkaninfo.txt | sort -u
          grep -A3 'VK_LAYER_KHRONOS_validation' vulkaninfo.txt | head -5
      - name: Build the throwaway program
        run: |
          sudo apt-get install -y -qq --no-install-recommends ninja-build >/dev/null
          cmake -S spike/lvpbench -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DVulkan_INCLUDE_DIR=$HOME/vulkan-sdk/include -DVulkan_LIBRARY=/usr/lib/x86_64-linux-gnu/libvulkan.so.1
          cmake --build build
      - name: Benchmark (timed)
        run: time spike/bench.sh build/lvpbench pinned-mesa results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-pinned-mesa
          path: |
            results.jsonl
            vulkaninfo.txt
            images/

  # Windows options: lavapipe from mesa-dist-win, lavapipe from jakoch/rasterizers, SwiftShader.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan SDK (timed)
        uses: jakoch/install-vulkan-sdk-action@v1.8.1
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
          cache: true
          stripdown: true
      - name: Software drivers (timed)
        shell: bash
        run: |
          start=$(date +%s)
          curl -sSfL --retry 3 -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_VERSION}/mesa3d-${MESA_VERSION}-release-msvc.7z"
          7z x -y -omesa-dist-win mesa.7z >/dev/null
          echo "mesa-dist-win seconds: $(( $(date +%s) - start ))"; sha256sum mesa.7z
          ls mesa-dist-win; ls mesa-dist-win/x64 | head -60
          start=$(date +%s)
          curl -sSfL --retry 3 -o lvp.zip "https://github.com/jakoch/rasterizers/releases/download/20261006/lavapipe-x64-26.2.4.zip"
          7z x -y -orasterizers-lavapipe lvp.zip >/dev/null
          curl -sSfL --retry 3 -o ss.zip "https://github.com/jakoch/rasterizers/releases/download/20261005/swiftshader-win64-5.0.0.1.zip"
          7z x -y -oswiftshader ss.zip >/dev/null
          echo "rasterizers seconds: $(( $(date +%s) - start ))"; sha256sum lvp.zip ss.zip
          find rasterizers-lavapipe swiftshader -maxdepth 4 | head -40
      - name: Build the throwaway program
        shell: bash
        run: cmake -S spike/lvpbench -B build && cmake --build build --config Release
      - name: vulkaninfo and benchmark per driver
        shell: bash
        run: |
          find "$VULKAN_SDK" -iname 'vulkaninfo*.exe' -o -iname 'vulkan-1.dll' -o -iname 'VkLayer_khronos_validation.json'
          vulkaninfo=$(find "$VULKAN_SDK" -iname 'vulkaninfo*.exe' | head -1)
          export PATH="$(cygpath -u "$VULKAN_SDK")/runtime/x64:$PATH"
          ls -R rasterizers-lavapipe/share
          icd=rasterizers-lavapipe/share/vulkan/icd.d/lvp_icd.x86_64.json
          if [ ! -f "$icd" ]; then
            mkdir -p "$(dirname "$icd")"
            echo '{"file_format_version":"1.0.0","ICD":{"library_path":"..\\..\\..\\bin\\vulkan_lvp.dll","api_version":"1.4.0"}}' > "$icd"
          fi
          printf '%s\n' "$PWD/mesa-dist-win/x64/lvp_icd.x86_64.json" "$PWD/$icd" "$PWD/swiftshader/vk_swiftshader_icd.json" > icds.txt
          # The runner is elevated, so the loader ignores VK_DRIVER_FILES and VK_LAYER_PATH: use the registry.
          export MSYS2_ARG_CONV_EXCL='*'
          reg query 'HKLM\SOFTWARE\Khronos\Vulkan' /s || true
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\ExplicitLayers' /v "$(cygpath -w "$VULKAN_SDK/Bin/VkLayer_khronos_validation.json")" /t REG_DWORD /d 0 /f
          while read -r icd; do
            label=$(echo "${icd#$PWD/}" | cut -d/ -f1)
            echo "::group::$label $icd"
            cat "$icd"; echo
            reg delete 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /f >/dev/null 2>&1 || true
            reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$(cygpath -w "$icd")" /t REG_DWORD /d 0 /f
            "$vulkaninfo" --summary || true
            "$vulkaninfo" > "vulkaninfo-$label.txt" 2>&1 || true
            grep -E 'apiVersion|driverInfo|VK_KHR_ray_query|VK_EXT_headless_surface' "vulkaninfo-$label.txt" | sort -u || true
            time spike/bench.sh build/Release/lvpbench.exe "windows-$label" results.jsonl quick
            echo "::endgroup::"
          done < icds.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows
          path: |
            results.jsonl
            vulkaninfo-*.txt
            images/
