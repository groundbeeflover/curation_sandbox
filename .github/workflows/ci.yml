# Builds and tests every pull request and every push to main on Linux and Windows through the
# CMake presets, plus a fast job for formatting, the planning scripts and the task file. GPU
# tests live in gpu.yml (M1-29); vcpkg caching and the full compiler matrix arrive with M1-30.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: checks (format, scripts, task file)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned clang-format
        run: pip install clang-format==23.1.4

      - name: Formatting
        run: python3 scripts/format.py --check

      - name: Script tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Task file
        run: python3 scripts/github-bootstrap.py --check

  # The release preset on Linux and Windows, the debug preset (ASan and UBSan) on Linux. The
  # libraries come from the runner's vcpkg in manifest mode (vcpkg.json); its clone is fetched
  # first, because the pinned builtin-baseline can be newer than the runner image.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, preset: release }
          - { os: windows-2022, preset: release }
          - { os: ubuntu-24.04, preset: debug }
    name: build-and-test (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin

      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Only a speed-up, installed with apt. When the runner cannot reach Ubuntu's mirrors, the
      # build goes on without it instead of failing.
      - name: Compiler cache (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        timeout-minutes: 5
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-${{ matrix.preset }}

      - name: Configure
        shell: bash
        run: |
          launcher=""
          if command -v ccache >/dev/null; then launcher="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"; fi
          cmake --preset ${{ matrix.preset }} -DCS_WARNINGS_AS_ERRORS=ON $launcher

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
