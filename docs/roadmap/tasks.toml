touches = ["docs/adr/0010-gpu-tests-in-ci.md"]
goal = "Decide how GPU tests and golden images run in GitHub Actions, so that M1-29 can add the job without guesswork. Time box: one session."
context = [
  "docs/adr/0002-rendering-tiers.md, Testing in CI",
  "Lavapipe ray tracing (Mesa 24.1): https://phoronix.com/news/Lavapipe-RT-Pipelines-Mesa-24.1",
  "ubuntu-24.04 runner image (no Mesa preinstalled): https://github.com/actions/runner-images/blob/main/images/ubuntu/Ubuntu2404-Readme.md",
  "Vulkan SDK action with lavapipe and SwiftShader: https://github.com/jakoch/install-vulkan-sdk-action",
  "Experiments run on a throwaway branch spike/lavapipe with a workflow triggered by pushes to that branch (workflow_dispatch only works from the default branch); only the decision record is merged",
