[[tasks]]
id = "M1-01"
epic = "E1.1"
title = "Module layout with cs_add_module, presets and a vcpkg baseline"
area = "build"
type = "chore"
size = "M"
owner = "agent"
blocked_by = []
touches = ["CMakeLists.txt", "CMakePresets.json", "cmake/CsModule.cmake", "cmake/CsOptions.cmake", "cmake/tests/", "vcpkg.json", "vcpkg-configuration.json", "core/", "tests/CMakeLists.txt", "tests/test_image.cpp", "tests/test_photometry.cpp", "libs/", "apps/CMakeLists.txt", "apps/pt/CMakeLists.txt", "tools/sanitizers/", ".github/workflows/ci.yml", ".gitignore", "README.md"]
goal = "Move the project to the layout of the blueprint (section 7): every module under libs/ is one cs_add_module call that finds its own sources and tests, every module directory exists from the start with its declared dependencies, the presets cover every way the project is built, and dependencies come from vcpkg in manifest mode. After this, parallel tasks never edit a shared file list."
context = [
  "docs/product/blueprint.md, section 7: Modules, Files and layout, Built for parallel work",
  "docs/adr/0001-engine.md: vcpkg in manifest mode; Qt installed outside vcpkg",
  "The existing CMakeLists.txt (the cs_options target, sanitizers, warnings) and CMakePresets.json (debug, release, profile) are kept",
  "vcpkg manifest mode: https://learn.microsoft.com/vcpkg/concepts/manifest-mode ; GitHub runners set VCPKG_INSTALLATION_ROOT, not VCPKG_ROOT",
  "Catch2 and CTest: catch_discover_tests(... ADD_TAGS_AS_LABELS), SKIP_RETURN_CODE; Catch2 exits with code 4 for a skipped test",
]
acceptance = [
  "cmake/CsModule.cmake defines cs_add_module(NAME <m> DEPS <modules> EXTERNAL <targets>): a library cs::<m> from every .cpp under libs/<m>/src/ (GLOB_RECURSE with CONFIGURE_DEPENDS, so a new subdirectory such as src/commands/ needs no CMake edit), public headers in libs/<m>/include/, and a test executable cs_<m>_tests from libs/<m>/tests/; a module with no sources yet is skipped without error",
  "Test executables are labelled with their module name automatically (as well as their Catch2 tags), get CS_SOURCE_DIR (the repository root) to find tests/scenes/ and data/, count exit code 4 as skipped, and use the module's own tests/main.cpp instead of Catch2WithMain when one exists",
  "libs/<m>/CMakeLists.txt exists for every module in blueprint section 7 (core, doc, geom, light, material, assets, world, engine, gpu, editor, ui) with the dependencies the blueprint allows; ui is only configured when CS_BUILD_APP is on",
  "The root CMakeLists.txt includes every cmake/Cs*.cmake by glob, and apps/CMakeLists.txt adds every apps/*/ that has a CMakeLists.txt, so later tasks add helpers and apps without editing either file",
  "Configure, build and test presets: debug (ASan and UBSan), release, profile, app (debug with CS_BUILD_APP=ON) and fuzz (Clang, CS_FUZZ=ON, every libs/<m>/fuzz/*.cpp a libFuzzer target; Linux only). debug and app set LSAN_OPTIONS to use tools/sanitizers/lsan.supp. Test presets set noTestsAction to error, so a label that matches nothing fails",
  "`ctest --preset debug -R cmake_module_glob` passes: a fixture project under cmake/tests/ shows that a new source (also in a new subdirectory) and a new test file are built with no CMake edit, and that including a header of an undeclared module fails to compile",
  "vcpkg.json declares catch2, glm and nlohmann-json with a pinned builtin-baseline; the presets use $VCPKG_ROOT's toolchain, and configuring without VCPKG_ROOT stops with a message saying how to install vcpkg",
  ".github/workflows/ci.yml builds and tests through the presets, with VCPKG_ROOT set from VCPKG_INSTALLATION_ROOT, so this pull request's own CI passes",
  "The existing image and photometry tests move to libs/core/tests and pass: `ctest --preset debug -L core` and `ctest --preset release -L core` report 100% passed",
  "apps/pt still builds (cs-render replaces it in M1-17); the README's build section gives the new commands",
]
out_of_scope = [
  "Any other dependency (M1-02); CI caching and the full compiler matrix (M1-30)",
  "Generated registries and the integration-test executable (M1-34)",
  "New code in any module; removing apps/pt (M1-17)",
]
verification = [
  "cmake --preset debug && cmake --build --preset debug && ctest --preset debug",
  "cmake --preset release && cmake --build --preset release && ctest --preset release",
  "ctest --preset debug -R cmake_module_glob --output-on-failure",
  "python3 scripts/format.py --check",
]

[[tasks]]
id = "M1-02"
epic = "E1.1"
title = "Dependencies for M1 and M2, licence files and the dependency policy"
area = "build"
type = "chore"
size = "M"
owner = "agent"
blocked_by = ["M1-01"]
touches = ["vcpkg.json", "vcpkg-configuration.json", "libs/core/CMakeLists.txt", "libs/engine/CMakeLists.txt", "libs/gpu/CMakeLists.txt", "libs/assets/CMakeLists.txt", "libs/doc/CMakeLists.txt", "third_party/", "docs/dependencies.md", "scripts/check-dependencies.py", "scripts/tests/test_check_dependencies.py", "LICENSE", "NOTICE"]
goal = "Declare in vcpkg the libraries milestones 1 and 2 use (ADR 0001), record every dependency and shipped data asset with its version and licence in docs/dependencies.md with a script that keeps them in sync, and add the Apache-2.0 licence. Open Image Denoise and KTX are added later by the tasks that first use them."
context = [
  "docs/adr/0001-engine.md, Libraries: the full list and licences",
  "docs/adr/0009-platforms-licence-distribution.md: allowed licences, SPDX headers",
  "docs/adr/0003-painting-materials.md and 0004-catalogue.md: shipped data must be CC0 or similar",
  "NVIDIA FLIP (BSD-3), to vendor as a header: https://github.com/NVlabs/flip",
]
acceptance = [
  "vcpkg.json adds embree, volk, vk-bootstrap, vulkan-memory-allocator, vulkan-headers, shader-slang, stb, tinyexr, tiff, lcms and miniz; each module's CMakeLists.txt links the ones the blueprint gives it; all configure and build on Linux (GCC) and Windows (MSVC). Where a port is missing or broken, a pinned prebuilt archive fetched by CMake with a SHA-256 is used and documented",
  "NVIDIA FLIP's C++ header is vendored in third_party/flip/ with its licence file",
  "docs/dependencies.md lists every library (name, version, licence, purpose, module), Qt (the pinned version, installed outside vcpkg, LGPL obligations), the Vulkan validation layers, clang-format 23.1.4, and data assets: test images, the UI font (an SIL Open Font License font chosen here), later the catalogue and IES files; and states the allowed licences",
  "`python3 scripts/check-dependencies.py` exits 1 when a vcpkg.json dependency is missing from docs/dependencies.md or has a licence outside the allowed list, and 0 now; `python3 -m unittest discover -s scripts/tests` passes",
  "LICENSE holds the Apache-2.0 text and NOTICE the project notice",
]
out_of_scope = [
  "Using the new libraries beyond linking them (later tasks)",
  "CI caching and compiler jobs (M1-30); Qt in CI (M1-31)",
  "Open Image Denoise (M3) and KTX-Software (M4)",
]
verification = [
  "python3 scripts/check-dependencies.py",
  "python3 -m unittest discover -s scripts/tests",
  "cmake --preset debug && cmake --build --preset debug && ctest --preset debug",
  "cmake --preset release && cmake --build --preset release && ctest --preset release",
]

[[tasks]]
id = "M1-03"
epic = "E1.1"
title = "Spike: Vulkan tests in CI on lavapipe"
area = "gpu"
type = "spike"
size = "S"
owner = "agent"
