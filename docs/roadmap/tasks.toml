# The task backlog seed. scripts/github-bootstrap.py reads this file and creates the GitHub
# milestones, labels, epic issues and task issues it describes, matching existing issues by the
# ID in their title. Once an issue exists, the issue is the source of truth for its status;
# edit this file only to add tasks (when /groom decomposes the next milestone) or to fix a task
# that has not been started.
#
# Check it with:  python3 scripts/github-bootstrap.py --check
# Field reference: docs/roadmap.md, "The task file".

version = 1
repository = "groundbeeflover/curation_sandbox"
project_board = "Curation Sandbox"

